<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" role="img" aria-labelledby="title desc">
  <title id="title">MCP is live — connect your APIs to AI</title>
  <desc id="desc">Connect public Instagram and TikTok data to ChatGPT, Claude or Codex with your existing API key and plan. Connect via MCP at jsonscraper.com/mcp.</desc>
  <defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3c251e"/><stop offset="1" stop-color="#131923"/></linearGradient></defs>
  <rect x="1" y="1" width="438" height="408" rx="20" fill="url(#wash)" stroke="#724229"/>
  <g font-family="Arial, Helvetica, sans-serif">
  <rect x="25" y="27" width="111" height="28" rx="14" fill="#3c251e"/>
  <circle cx="40" cy="41" r="4" fill="#ff5e00"/>
  <text x="51" y="45" font-size="11" font-weight="700" letter-spacing="1.2" fill="#ff985e">MCP IS LIVE</text>
  <text x="26" y="104" font-size="34" font-weight="700" letter-spacing="-1" fill="#f8fafc">Connect your</text>
  <text x="26" y="145" font-size="34" font-weight="700" letter-spacing="-1" fill="#f8fafc">APIs to AI.</text>
  <text x="26" y="188" font-size="18" fill="#bac6d7">Instagram + TikTok data,</text>
  <text x="26" y="215" font-size="18" fill="#bac6d7">inside your AI assistant.</text>
  <text x="26" y="258" font-size="15" font-weight="600" fill="#f8fafc">ChatGPT · Claude · Codex</text>
  <rect x="26" y="282" width="388" height="54" rx="12" fill="#ff5e00"/>
  <text x="220" y="316" font-size="18" text-anchor="middle" font-weight="700" fill="#fff">Connect via MCP  →</text>
  <text x="26" y="374" font-size="13" fill="#bac6d7">Your existing API key. Your current plan.</text>
  <text x="414" y="41" font-size="12" text-anchor="end" font-weight="700" fill="#bac6d7">jsonscraper</text>
  </g>
</svg>
