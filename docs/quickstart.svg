<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="TikTok API quick start"><rect width="1000" height="230" rx="20" fill="#fafafa"/><text x="34" y="47" fill="#17191f" font-family="sans-serif" font-size="24" font-weight="700">jsonscraper · TikTok Scraper API</text><text x="34" y="76" fill="#747478" font-family="sans-serif" font-size="15">PHP · From license key to structured JSON</text><rect x="34" y="110" width="214" height="82" rx="12" fill="#ffffff" stroke="#e8e8eb"/><text x="49" y="141" fill="#ff5e00" font-family="sans-serif" font-size="15" font-weight="700">1 · GET ACCESS</text><text x="49" y="169" fill="#52525b" font-family="sans-serif" font-size="12">Choose a plan and API key</text><path d="M255 150h10m-4-4 4 4-4 4" fill="none" stroke="#ff5e00" stroke-width="2"/><rect x="274" y="110" width="214" height="82" rx="12" fill="#ffffff" stroke="#e8e8eb"/><text x="289" y="141" fill="#ff5e00" font-family="sans-serif" font-size="15" font-weight="700">2 · INSTALL</text><text x="289" y="169" fill="#52525b" font-family="sans-serif" font-size="12">Add the SDK to your app</text><path d="M495 150h10m-4-4 4 4-4 4" fill="none" stroke="#ff5e00" stroke-width="2"/><rect x="514" y="110" width="214" height="82" rx="12" fill="#ffffff" stroke="#e8e8eb"/><text x="529" y="141" fill="#ff5e00" font-family="sans-serif" font-size="15" font-weight="700">3 · REQUEST</text><text x="529" y="169" fill="#52525b" font-family="sans-serif" font-size="12">Read a profile or media</text><path d="M735 150h10m-4-4 4 4-4 4" fill="none" stroke="#ff5e00" stroke-width="2"/><rect x="754" y="110" width="214" height="82" rx="12" fill="#ffffff" stroke="#e8e8eb"/><text x="769" y="141" fill="#ff5e00" font-family="sans-serif" font-size="15" font-weight="700">4 · BUILD</text><text x="769" y="169" fill="#52525b" font-family="sans-serif" font-size="12">Use the JSON in your app</text></svg>
